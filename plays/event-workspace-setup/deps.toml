schema_version = 1

[[tools]]
id = "git"
command = "git"
required = true

[[tools.install]]
manager = "brew"
package = "git"

[[tools.install]]
manager = "apt"
package = "git"

[[tools.install]]
manager = "winget"
package = "Git.Git"

[[tools]]
id = "deno-runtime"
command = "deno"
required = true

[[tools.install]]
manager = "rote"
command = ["rote", "deno", "install"]

[[tools]]
id = "rote-cli"
command = "rote"
required = true

[[tools.install]]
manager = "official"
command = ["bash", "-c", "ROTE_YES=1 bash -c \"$(curl -fsSL https://getrote.dev/install)\""]
